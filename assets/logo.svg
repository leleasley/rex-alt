<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Rex-Alt logo">
  <title>Rex-Alt</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#124b40"/>
      <stop offset="1" stop-color="#0b2e28"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="112" y="72" width="800" height="620" rx="96" fill="url(#badge)"/>

  <!-- stacked media tiles / play cards -->
  <g transform="translate(238 236)">
    <rect x="0" y="0" width="250" height="300" rx="26" fill="#f5a623" opacity="0.28"/>
    <rect x="26" y="-18" width="250" height="300" rx="26" fill="#f5a623" opacity="0.55"/>
    <rect x="52" y="-36" width="250" height="300" rx="26" fill="#f7f1e3"/>
    <path d="M148 76 L148 152 L214 114 Z" fill="#0f3d34"/>
    <path d="M74 194 L262 194" stroke="#0f3d34" stroke-width="12" stroke-linecap="round" opacity="0.35"/>
    <path d="M74 222 L214 222" stroke="#0f3d34" stroke-width="12" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- raptor head silhouette facing right -->
  <g transform="translate(470 196)">
    <path d="M36 300 L96 168 L188 96 L262 60 L246 122 L306 118 L286 170 L344 196 L300 232 L318 286 L246 308 L206 360 L150 344 L112 396 L96 332 L40 344 Z" fill="#f7f1e3"/>
    <path d="M262 60 L246 122 L306 118 Z" fill="#f5a623"/>
    <circle cx="252" cy="196" r="16" fill="#0f3d34"/>
    <path d="M300 232 L246 250 L286 268 Z" fill="#0f3d34" opacity="0.55"/>
  </g>

  <!-- wordmark -->
  <g fill="#0f3d34" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" text-anchor="middle">
    <text x="512" y="838" font-size="132" letter-spacing="2">REX-ALT</text>
  </g>
  <rect x="366" y="872" width="292" height="14" rx="7" fill="#f5a623"/>
</svg>
